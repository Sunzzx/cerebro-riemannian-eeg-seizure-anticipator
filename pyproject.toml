[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebro-riemannian-eeg-seizure-anticipator"
version = "0.1.0"
description = "Real-time Riemannian Manifold EEG Epileptic Seizure Anticipator & Neuromorphic BCI Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kandwal", email = "ayush@sunzzx.dev" }
]
keywords = [
    "eeg",
    "seizure-prediction",
    "riemannian-geometry",
    "spd-manifold",
    "brain-computer-interface",
    "bci",
    "epilepsy",
    "computational-neuroscience",
    "biomedical-engineering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cerebro-seizure = "cerebro_seizure.demo:main"

[project.urls]
Homepage = "https://github.com/Sunzzx/cerebro-riemannian-eeg-seizure-anticipator"
Repository = "https://github.com/Sunzzx/cerebro-riemannian-eeg-seizure-anticipator"
"Bug Tracker" = "https://github.com/Sunzzx/cerebro-riemannian-eeg-seizure-anticipator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebro_seizure"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers"
